<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fond rond avec dégradé -->
  <rect width="200" height="200" rx="40" ry="40" fill="url(#bgGrad)"/>

  <!-- Icône microphone stylisé -->
  <!-- Corps du micro -->
  <rect x="82" y="38" width="36" height="64" rx="18" fill="white" opacity="0.95"/>

  <!-- Arc de connection micro -->
  <path d="M 56 96 Q 56 138 100 138 Q 144 138 144 96"
        stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Pied du micro -->
  <line x1="100" y1="138" x2="100" y2="158" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <line x1="76" y1="158" x2="124" y2="158" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- Barres audio ondes (droite) -->
  <rect x="152" y="72" width="8" height="56" rx="4" fill="url(#waveGrad)" opacity="0.85"/>
  <rect x="164" y="84" width="8" height="32" rx="4" fill="url(#waveGrad)" opacity="0.65"/>
  <rect x="176" y="92" width="8" height="16" rx="4" fill="url(#waveGrad)" opacity="0.45"/>

  <!-- Barres audio ondes (gauche) -->
  <rect x="40" y="72" width="8" height="56" rx="4" fill="url(#waveGrad)" opacity="0.85"/>
  <rect x="28" y="84" width="8" height="32" rx="4" fill="url(#waveGrad)" opacity="0.65"/>
  <rect x="16" y="92" width="8" height="16" rx="4" fill="url(#waveGrad)" opacity="0.45"/>

  <!-- Texte VL en bas -->
  <text x="100" y="190" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="11" font-weight="700"
        fill="white" opacity="0.85" letter-spacing="3">
    VOICELINGO
  </text>
</svg>
