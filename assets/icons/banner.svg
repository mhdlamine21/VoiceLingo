<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="900" height="280" fill="url(#bannerGrad)" rx="16"/>

  <!-- Grille de points (décoration) -->
  <g opacity="0.06">
    <circle cx="50" cy="50" r="2" fill="white"/> <circle cx="100" cy="50" r="2" fill="white"/>
    <circle cx="150" cy="50" r="2" fill="white"/> <circle cx="200" cy="50" r="2" fill="white"/>
    <circle cx="50" cy="100" r="2" fill="white"/> <circle cx="100" cy="100" r="2" fill="white"/>
    <circle cx="150" cy="100" r="2" fill="white"/> <circle cx="50" cy="150" r="2" fill="white"/>
    <circle cx="100" cy="150" r="2" fill="white"/> <circle cx="50" cy="200" r="2" fill="white"/>
    <circle cx="700" cy="50" r="2" fill="white"/> <circle cx="750" cy="50" r="2" fill="white"/>
    <circle cx="800" cy="50" r="2" fill="white"/> <circle cx="850" cy="50" r="2" fill="white"/>
    <circle cx="750" cy="100" r="2" fill="white"/> <circle cx="800" cy="100" r="2" fill="white"/>
    <circle cx="850" cy="100" r="2" fill="white"/> <circle cx="800" cy="150" r="2" fill="white"/>
    <circle cx="850" cy="150" r="2" fill="white"/> <circle cx="850" cy="200" r="2" fill="white"/>
  </g>

  <!-- Logo icon gauche -->
  <g transform="translate(60, 60)">
    <rect width="120" height="120" rx="24" fill="url(#blueGrad)" filter="url(#glow)"/>
    <!-- Micro -->
    <rect x="42" y="12" width="36" height="56" rx="18" fill="white" opacity="0.95"/>
    <path d="M 22 62 Q 22 98 60 98 Q 98 98 98 62" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    <line x1="60" y1="98" x2="60" y2="112" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="112" x2="80" y2="112" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <!-- Ondes -->
    <rect x="108" y="32" width="6" height="40" rx="3" fill="white" opacity="0.7"/>
    <rect x="116" y="42" width="6" height="20" rx="3" fill="white" opacity="0.5"/>
  </g>

  <!-- Titre principal -->
  <text x="220" y="118" font-family="Segoe UI, Arial, sans-serif"
        font-size="58" font-weight="800" fill="white" letter-spacing="-1">
    VoiceLingo
  </text>

  <!-- Trait décoratif sous le titre -->
  <rect x="220" y="128" width="320" height="3" rx="2" fill="url(#blueGrad)"/>

  <!-- Sous-titre -->
  <text x="220" y="162" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" fill="#94a3b8" letter-spacing="0.5">
    Video Translation Platform · 100% Local AI
  </text>

  <!-- Badges tech -->
  <g transform="translate(220, 185)">
    <!-- Python -->
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#1e40af"/>
    <text x="40" y="17" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#93c5fd">Python 3.10+</text>

    <!-- Whisper -->
    <rect x="90" y="0" width="90" height="26" rx="13" fill="#0d9488"/>
    <text x="135" y="17" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#99f6e4">Whisper large-v3</text>

    <!-- NLLB -->
    <rect x="190" y="0" width="60" height="26" rx="13" fill="#7c3aed"/>
    <text x="220" y="17" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#ddd6fe">NLLB-200</text>

    <!-- Local -->
    <rect x="260" y="0" width="72" height="26" rx="13" fill="#15803d"/>
    <text x="296" y="17" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#bbf7d0">100% Local</text>

    <!-- Docker -->
    <rect x="342" y="0" width="62" height="26" rx="13" fill="#0369a1"/>
    <text x="373" y="17" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#bae6fd">Docker</text>
  </g>

  <!-- Côté droit - stats -->
  <g transform="translate(660, 70)">
    <text x="110" y="0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b" letter-spacing="1">CAPACITÉS</text>

    <text x="110" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="url(#blueGrad)">22h</text>
    <text x="110" y="54" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">vidéos supportées</text>

    <line x1="20" y1="70" x2="200" y2="70" stroke="#1e293b" stroke-width="1"/>

    <text x="110" y="98" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="url(#blueGrad)">200</text>
    <text x="110" y="116" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">langues NLLB</text>

    <line x1="20" y1="132" x2="200" y2="132" stroke="#1e293b" stroke-width="1"/>

    <text x="110" y="160" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="url(#blueGrad)">80+</text>
    <text x="110" y="178" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">termes protégés</text>
  </g>
</svg>
