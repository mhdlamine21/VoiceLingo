name: CI — VoiceLingo Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests unitaires Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Installer les dépendances légères (tests unitaires uniquement)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Les modèles IA (torch, faster-whisper, TTS) ne sont PAS
          # installés en CI — les tests unitaires n'en ont pas besoin.

      - name: Lancer les tests unitaires
        run: python -m pytest tests/ -v --tb=short

      - name: Rapport de couverture de code
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage vers Codecov (optionnel)
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Vérification syntaxe Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer flake8
        run: pip install flake8

      - name: Lancer flake8
        run: |
          flake8 *.py \
            --max-line-length=110 \
            --ignore=E501,W503 \
            --exclude=venv,__pycache__,.git
